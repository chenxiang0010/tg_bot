[package]
name = "tg_bot"
version = "0.1.0"
edition = "2024"

[dependencies]
teloxide = { version = "0.17.0", features = ["macros"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "io-util",
    "time",
] }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
] }
zip = { version = "8", default-features = false, features = ["deflate"] }
ffmpeg-next = "9.1"
rlottie = "0.5"
flate2 = "1"
anyhow = "1"
dotenvy = "0.15"
futures = "0.3"
log = "0.4"
mime = "0.3"
pretty_env_logger = "0.5"
