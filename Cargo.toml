[package]
name = "tg_bot"
version = "0.1.0"
edition = "2024"

[dependencies]
teloxide = { version = "0.17.0", features = ["macros"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "io-util",
    "time",
] }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
] }
zip = { version = "8", default-features = false, features = ["deflate"] }
ffmpeg-next = "9.1"
rlottie = "0.5"
flate2 = "1"
anyhow = "1"
dotenvy = "0.15"
futures = "0.3"
log = "0.4"
mime = "0.3"
pretty_env_logger = "0.5"
# 自己建 HTTP 客户端：teloxide 默认的 17 秒超时传不动几十 MB 的压缩包。
# 版本和 feature 跟 teloxide 用的是同一个 reqwest，不会编出第二份。
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "multipart",
    "stream",
] }
